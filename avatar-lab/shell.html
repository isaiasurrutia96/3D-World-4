<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f1ee"><title>Assembled avatar</title>
 <style>
  *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#343b40;background:#f1f1ee}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #b36338;outline-offset:3px}.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:76px minmax(0,1fr)}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:15px 28px;gap:12px;border-bottom:1px solid #dddcd5}h1{font-size:22px;font-weight:650;line-height:1.2;letter-spacing:-.6px;margin:0}.subtitle{font-size:12px;color:#73796f;margin:5px 0 0}#rest-all{min-height:42px;padding:0 15px;border:1px solid #d9d9d1;border-radius:11px;background:#ffffff80;color:#46524b;font-size:12px}
  #stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:#405363}canvas{display:block;touch-action:none}.hint{position:absolute;left:26px;top:19px;color:#d1dbe3;font-size:12px;pointer-events:none}.views{position:absolute;bottom:23px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;background:#ffffffdf;border-radius:14px;box-shadow:0 3px 18px #0001}.views button{min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#565c5d;font-size:12px}.views button[aria-pressed=true]{background:#dce1d6;color:#394334}
  aside{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px;background:#fafaf6;border-left:1px solid #dddcd5}.tabs{display:flex;padding:4px;gap:4px;border-radius:12px;background:#e9ece3}.tabs button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:#565f52;font-size:13px}.tabs button[aria-selected=true]{background:#fff;box-shadow:0 1px 5px #0001;color:#35432d}#play{width:100%;min-height:44px;border:1px solid #d6d8ce;border-radius:10px;background:transparent;margin:12px 0 22px;color:#53604c;font-size:13px}#play[aria-pressed=true]{background:#e8ecdf;border-color:#849276}.panel-label{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:700;color:#81867b;margin:0 0 12px}.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.presets button{border:1px solid #dddfd5;background:#f0f1e9;color:#424b40;border-radius:10px;min-height:44px;font-size:11px;padding:0 3px}.presets button[aria-pressed=true]{border-color:#525f4a;background:#525f4a;color:white}.divider{height:1px;background:#e0e2d8;margin:22px 0}.motion-row{margin:0 0 18px}.motion-heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}.motion-heading label{font-size:13px;font-weight:550}.motion-heading output{font-size:11px;font-variant-numeric:tabular-nums;color:#81867a}.motion-row input{display:block;width:100%;height:27px;accent-color:#657456;cursor:pointer;touch-action:pan-y;margin:0}.axis-labels{display:flex;justify-content:space-between;font-size:10px;color:#93988b}.note{font-size:11px;line-height:1.65;color:#858b7d;margin:17px 0 0}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d1dbe3;background:#405363;font-size:13px;z-index:3}[hidden]{display:none!important}
  @media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:65px minmax(200px,1fr) minmax(230px,40dvh)}header{padding:12px 18px}h1{font-size:19px}.subtitle{font-size:10px}.hint{left:18px;top:15px;font-size:11px}.views{bottom:12px;gap:1px}.views button{min-height:40px;padding:0 9px;font-size:11px}aside{border-left:0;border-top:1px solid #dddcd5;padding:13px 20px max(20px,env(safe-area-inset-bottom))}#play{margin:8px 0 17px}.panel-label{margin-bottom:9px}.divider{margin:17px 0}.motion-row{margin-bottom:13px}.note{margin-top:10px}}
  @media(max-height:650px) and (max-width:700px){.app{grid-template-rows:58px minmax(170px,1fr) 42dvh}.subtitle,.hint{display:none}}
 </style>
</head>
<body>
 <main class="app">
  <header><div><h1>Assembled avatar</h1><p class="subtitle">Hands, feet and fitted sockets.</p></div><button id="rest-all">Rest all</button></header>
  <section id="stage" aria-label="Interactive assembled avatar">
   <div class="hint">Drag to rotate · Pinch or scroll to zoom</div>
   <nav class="views" aria-label="Avatar views"><button data-view="angle" aria-pressed="true">Angle</button><button data-view="front" aria-pressed="false">Front</button><button data-view="side" aria-pressed="false">Side</button><button data-view="back" aria-pressed="false">Back</button><button data-view="top" aria-pressed="false">Top</button></nav>
   <div id="loading" class="loading" role="status">Assembling your avatar…</div>
  </section>
  <aside aria-label="Avatar movement controls">
   <div class="tabs" role="tablist" aria-label="Movement"><button id="hands-tab" role="tab" aria-selected="false" aria-controls="hands-panel">Hands</button><button id="feet-tab" role="tab" aria-selected="true" aria-controls="feet-panel">Feet</button></div>
   <button id="play" aria-pressed="false">Play motion</button>
   <section id="hands-panel" role="tabpanel" aria-labelledby="hands-tab" hidden><p class="panel-label">Hand poses</p><div class="presets" role="group" aria-label="Hand poses"><button data-hand-pose="rest" aria-pressed="true">Rest</button><button data-hand-pose="relax" aria-pressed="false">Relax</button><button data-hand-pose="open" aria-pressed="false">Open</button><button data-hand-pose="curl" aria-pressed="false">Curl</button><button data-hand-pose="point" aria-pressed="false">Point</button></div><div class="divider"></div><div id="hand-controls"></div><p class="note">Both hands move together. The palms stay centered in their sockets.</p></section>
   <section id="feet-panel" role="tabpanel" aria-labelledby="feet-tab"><p class="panel-label">Foot poses</p><div class="presets" role="group" aria-label="Foot poses"><button data-foot-pose="rest" aria-pressed="true">Rest</button><button data-foot-pose="point" aria-pressed="false">Point</button><button data-foot-pose="flex" aria-pressed="false">Flex</button><button data-foot-pose="toes" aria-pressed="false">Toes</button><button data-foot-pose="tiptoe" aria-pressed="false">Tiptoe</button></div><div class="divider"></div><div id="foot-controls"></div><p class="note">The calves stay rigid. Tiptoe lifts the body while the front of each foot stays planted.</p></section>
  </aside>
 </main>
 <script>/*AVATAR_LAB_BUNDLE*/</script>
</body>
</html>
