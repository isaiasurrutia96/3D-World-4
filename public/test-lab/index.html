<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#405363"><title>Test Lab</title>
 <link rel="stylesheet" href="./style.css?v=live-14">
</head>
<body>
 <main>
  <section class="viewer" id="viewer" aria-label="Test Lab 3D viewer">
   <a class="brand" href="#viewer" aria-label="Test Lab home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 4h10M13 4v8L6 24a2 2 0 0 0 2 3h16a2 2 0 0 0 2-3l-7-12V4M10 20h12"/></svg><span>TEST LAB</span></a>
   <div id="frame-host"></div><div id="loading" role="status">Preparing your avatar…</div>
   <section id="motion-panel" class="motion-panel" aria-label="Motion pose controls" hidden>
    <div class="motion-top"><strong>Motion</strong><div id="motion-tabs" role="tablist" aria-label="Pose type"></div><button id="motion-close" aria-label="Close motion controls">×</button></div>
    <div id="motion-presets" role="group" aria-label="Poses"></div>
    <div class="motion-actions"><button id="motion-play" aria-pressed="false">Play motion</button></div>
   </section>
   <nav class="views" aria-label="Viewing angle and visual mode"><button data-view="front" aria-pressed="false">Front</button><button data-view="side" aria-pressed="false">Side</button><button data-view="back" aria-pressed="false">Back</button><button data-view="top" aria-pressed="false">Top</button><button data-view="angle" aria-pressed="true">Angle</button><button data-view="isometric" aria-pressed="false">Isometric</button><button id="visual-mode" aria-pressed="false" title="Hide the floor for a clear inspection">Inspection</button><button id="motion-toggle" aria-expanded="false" aria-controls="motion-panel" disabled>Motion</button></nav>
   <a class="scroll-link" href="#workspace">Tests & animation <span aria-hidden="true">↓</span></a>
  </section>
  <section class="workspace" id="workspace" aria-label="Test and animation options">
   <div class="workspace-heading"><h1>Your workspace</h1><span id="subject-status">Avatar</span></div>
   <div class="mode-tabs" role="tablist" aria-label="Test mode"><button id="live-tab" role="tab" aria-selected="true" aria-controls="live-panel">Live test</button><button id="video-tab" role="tab" aria-selected="false" aria-controls="video-panel">Video animation</button></div>
   <section id="live-panel" role="tabpanel" aria-labelledby="live-tab">
    <div class="test-picker"><label for="subject">Choose a test<select id="subject"><optgroup label="Avatar"><option value="avatar">Our avatar</option><option value="rules">Movement rules (section 1)</option><option value="skeleton">Skeleton (section 2)</option><option value="hands">Hands</option><option value="feet">Feet</option></optgroup><optgroup label="Racing"><option value="tracks">Tracks (section 1)</option></optgroup><optgroup label="World & other studies"><option value="blocks">Blocks</option><option value="oval">Oval track</option><option value="island">Floating island</option><option value="motion">Motion study</option></optgroup></select></label><button id="reset">Reset</button></div>
    <p class="help" id="live-help">Drag the model to look around. Use the view buttons for a fixed angle.</p>
    <div id="live-controls" aria-label="Selected test controls"></div>
    <button class="return-button" id="return-to-viewer">Back to the model ↑</button>
   </section>
   <section id="video-panel" role="tabpanel" aria-labelledby="video-tab" hidden></section>
  </section>
 </main>
 <script type="module" src="./main.js?v=tracks-15"></script>
</body>
</html>
