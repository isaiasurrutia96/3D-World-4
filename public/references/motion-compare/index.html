<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f0eb"><title>Mario & our avatar · Same motion</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f0eb;color:#353b3d;font-family:system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:22px 16px max(24px,env(safe-area-inset-bottom))}h1{font-size:22px;margin:0 0 8px;letter-spacing:-.5px}.subtitle{font-size:13px;color:#747c77;line-height:1.6;margin:0 0 14px}video{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain;border-radius:12px;background:#f1f0eb}.rates{flex-wrap:wrap;display:flex;justify-content:center;gap:8px;margin:16px 0}button{font:inherit;font-size:14px;min-height:44px;min-width:105px;padding:0 14px;border-radius:10px;border:1px solid #d6dbd0;color:#465242;background:transparent;touch-action:manipulation;cursor:pointer}button[aria-pressed=true]{color:white;background:#54624b;border-color:#54624b}button:focus-visible,a:focus-visible{outline:3px solid #aa653d;outline-offset:3px}.links,.hint{text-align:center;font-size:13px;line-height:1.7;color:#747c77}.hint{font-size:12px}a{color:#4d6547;text-underline-offset:3px}
</style></head><body><main><h1>Mario & our avatar</h1><p class="subtitle">Matched timing, with relaxed running hands and a smaller arm swing.</p><video id="comparison" width="1440" height="900" autoplay muted loop playsinline controls preload="auto" poster="side-poster.jpg?v=run-grip-1" aria-label="Mario and our avatar performing the same motion side by side"><source src="side.mp4?v=run-grip-1" type="video/mp4">Open the GIF below to compare.</video><div class="rates views" role="group" aria-label="Camera view"><button data-view="side" aria-pressed="true">Side</button><button data-view="front" aria-pressed="false">Front</button><button data-view="feet" aria-pressed="false">Feet close-up</button></div><div class="rates" role="group" aria-label="Shared playback speed"><button data-rate="1" aria-pressed="true">Normal</button><button data-rate="0.5" aria-pressed="false">Slow · ½ speed</button></div><p class="hint">Choose a view. Both characters stay synchronized.<br>Pause or scrub to inspect the toe bend.<br>Turn your phone sideways for a larger view.</p><p class="links"><a id="gif" href="side-slow.gif?v=run-grip-1">Slow-motion GIF</a> · <a id="download" href="side.mp4?v=run-grip-1" download>Download video</a></p></main><script>
const media=name=>name+'?v=run-grip-1';
const video=document.querySelector('video');video.muted=true;video.playbackRate=1;let pending=null;
for(const button of document.querySelectorAll('[data-rate]'))button.onclick=()=>{const rate=Number(button.dataset.rate);video.playbackRate=rate;if(pending){pending.rate=rate;pending.paused=false;}for(const b of document.querySelectorAll('[data-rate]'))b.setAttribute('aria-pressed',String(b===button));video.play().catch(()=>{});};
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{
 if(button.getAttribute('aria-pressed')==='true')return;
 if(!pending)pending={time:video.currentTime,paused:video.paused,rate:video.playbackRate};
 const view=button.dataset.view;for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));
 video.pause();video.autoplay=false;video.poster=media(view+'-poster.jpg');video.src=media(view+'.mp4');video.load();
 document.querySelector('#gif').href=media(view+'-slow.gif');document.querySelector('#download').href=media(view+'.mp4');
};
video.addEventListener('loadedmetadata',()=>{if(!pending)return;const state=pending;pending=null;video.currentTime=Math.min(state.time,video.duration-.01);video.playbackRate=state.rate;if(state.paused)video.pause();else video.play().catch(()=>{});});
</script></body></html>
