</style></head><body><main><h1>Mario & our avatar</h1><p class="subtitle">Same poses. Same timing. Our avatar keeps his proportions.</p><video id="comparison" width="1440" height="900" autoplay muted loop playsinline controls preload="auto" poster="poster.jpg" aria-label="Mario and our avatar performing the same motion side by side"><source src="comparison.mp4" type="video/mp4">Open the GIF below to compare.</video><div class="rates" role="group" aria-label="Shared playback speed"><button data-rate="1" aria-pressed="true">Normal</button><button data-rate="0.5" aria-pressed="false">Slow · ½ speed</button></div><p class="hint">Both views stay synchronized. Pause or scrub to compare a pose.<br>Turn your phone sideways for a larger view.</p><p class="links"><a href="comparison-slow.gif">Slow-motion GIF</a> · <a href="comparison.mp4" download>Download video</a></p></main><script>
const video=document.querySelector('video');video.muted=true;video.playbackRate=1;
for(const button of document.querySelectorAll('[data-rate]'))button.onclick=()=>{video.playbackRate=Number(button.dataset.rate);for(const b of document.querySelectorAll('[data-rate]'))b.setAttribute('aria-pressed',String(b===button));video.play().catch(()=>{});};
</script></body></html>
