<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f0eb"><title>SM64 walking reference</title>
 <style>
  *{box-sizing:border-box}body{margin:0;background:#f1f0eb;color:#353b3d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:24px 20px max(24px,env(safe-area-inset-bottom))}h1{font-size:22px;letter-spacing:-.5px;font-weight:650;margin:0 0 7px}.subtitle{font-size:12px;line-height:1.6;color:#747c77;margin:0 0 16px}video{display:block;width:100%;height:auto;max-height:65dvh;object-fit:contain;background:#f1f0eb;border-radius:12px}.rates{display:flex;justify-content:center;gap:8px;margin:15px 0}button{font:inherit;font-size:13px;min-height:44px;min-width:110px;padding:0 18px;border-radius:10px;border:1px solid #d6dbd0;color:#465242;background:transparent;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{color:#fff;background:#54624b;border-color:#54624b}button:focus-visible,a:focus-visible{outline:3px solid #aa653d;outline-offset:3px}.links{text-align:center;font-size:13px;margin:18px 0 0}a{color:#4d6547;text-underline-offset:3px}.note{font-size:11px;line-height:1.6;color:#858d84;margin:20px 0 0;text-align:center}@media(max-width:600px){main{padding:19px 17px max(22px,env(safe-area-inset-bottom))}h1{font-size:20px}.subtitle{font-size:11px}}
 </style>
</head>
<body>
 <main>
  <h1>SM64 walking reference</h1>
  <p class="subtitle">Original walk poses, re-rendered in place. Slow motion is selected.</p>
  <video id="walk" width="720" height="900" autoplay muted loop playsinline controls preload="auto" poster="poster.jpg" aria-label="Mario's original SM64 walking pose cycle"><source src="walk.mp4" type="video/mp4">Open the GIF below to watch the walk.</video>
  <div class="rates" role="group" aria-label="Playback speed"><button data-rate="1" aria-pressed="false">Normal</button><button data-rate="0.5" aria-pressed="true">Slow · ½ speed</button></div>
  <p class="links"><a href="walk-slow.gif">Open the looping GIF</a> · <a href="walk.mp4" download>Download video</a></p>
  <p class="note">An animation reference, not a gameplay recording. Original model and motion data; simplified face graphics.<br>Mario © Nintendo · <a href="https://github.com/n64decomp/sm64/blob/9921382a68bb0c865e5e45eb594d9c64db59b1af/assets/anims/anim_48.inc.c" target="_blank" rel="noreferrer">Animation source</a></p>
 </main>
 <script>
  const video=document.querySelector('#walk');video.muted=true;video.playbackRate=.5;
  for(const button of document.querySelectorAll('[data-rate]'))button.onclick=()=>{video.playbackRate=Number(button.dataset.rate);for(const b of document.querySelectorAll('[data-rate]'))b.setAttribute('aria-pressed',String(b===button));document.querySelector('.subtitle').textContent='Original walk poses, re-rendered in place. '+(video.playbackRate===.5?'Slow motion is selected.':'Normal speed is selected.');video.play().catch(()=>{});};
 </script>
</body>
</html>
