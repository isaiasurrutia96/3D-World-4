  aside p{font-size:11px;color:#7a7f75;line-height:1.5;margin:0}

  @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:64px minmax(0,1fr) auto}aside{border-left:0;border-top:1px solid #dddcd5;max-height:38vh}}

  <header><div><h1>Skeleton</h1><p class="sub">Section 3 · Smooth poses, a turning waist, a bending chest</p></div></header>
  <section id="stage" aria-label="Avatar on its skeleton">

  </section>
  <aside>
   <h2>Poses</h2>
   <section><button data-pose="rest">Rest</button><button data-pose="arms-out">Arms out</button><button data-pose="arms-up">Arms up</button><button data-pose="wave">Wave</button><button data-pose="elbows">Elbows bent</button><button data-pose="kick">Kick</button><button data-pose="knee">Knee up</button><button data-pose="look">Look</button><button data-pose="turn">Waist turn</button><button data-pose="chest-bend">Chest bend</button><button data-pose="chest-twist">Chest twist</button><button data-pose="wind-up">Wind-up</button><button data-pose="shrug">Shrug</button><button data-pose="reach">Reach forward</button></section>
   <h2>Skeleton</h2>
   <section><button id="bones" aria-pressed="false">Show bones</button></section>
   <p>Poses move smoothly; Wave loops on the left arm. The chest bends softly in one piece, and the shoulders follow the arms. Fingers and toes come in a later section.</p>
  </aside>
