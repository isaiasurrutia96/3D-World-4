<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#405363"><title>Elbow study</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#405363;color:#343b40}.app{height:100dvh;display:grid;grid-template-rows:66px minmax(0,1fr)}header{padding:12px 22px;background:#f1f1ee;border-bottom:1px solid #dddcd5}h1{font-size:20px;margin:0}p{font-size:12px;margin:4px 0 0;color:#73796f}#stage{position:relative;min-height:0;overflow:hidden;background:#405363}canvas{display:block;touch-action:none}.views{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#f1f1ee;padding:5px;border-radius:12px}.views button{font:inherit;font-size:12px;min-height:42px;padding:0 12px;border:0;border-radius:8px;cursor:pointer;background:transparent;touch-action:manipulation}.views button[aria-pressed=true]{background:#dce1d6}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#405363;color:#e8eef2;font-size:13px}[hidden]{display:none!important}@media(max-width:600px){header{padding:11px 16px}.views{gap:1px}.views button{padding:0 10px;font-size:11px}}
 </style>
</head>
<body><main class="app">
 <header><h1>Elbow study</h1><p>Static study · upper arm · elbow ball · forearm</p></header>
 <section id="stage" aria-label="Separated upper arm, elbow ball and forearm">
  <nav class="views" aria-label="Views"><button data-view="front" aria-pressed="true">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="top">Top</button><button data-view="angle">Angle</button></nav>
  <div id="loading" role="status">Preparing the elbow study…</div>
 </section>
</main><script>/*ELBOW_BUNDLE*/</script></body>
</html>
