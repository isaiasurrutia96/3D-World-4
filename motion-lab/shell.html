<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#405363"><title>Motion Lab</title>
<style>
*{box-sizing:border-box}html{background:#405363;scroll-padding-top:var(--bar-height,110px)}body{margin:0;font-family:system-ui,sans-serif;color:#353b3e}button{font:inherit;cursor:pointer;min-height:44px;padding:8px 14px;border:1px solid #bfc0bc;border-radius:4px;background:#fff;color:#353b3e;touch-action:manipulation}button[aria-pressed=true]{background:#51575b;color:white}button:focus-visible,a:focus-visible{outline:3px solid #517b99;outline-offset:2px}[hidden]{display:none!important}#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-left));background:#f3f0e9;border-bottom:1px solid #c9c8c1}.identity{display:flex;align-items:baseline;gap:14px;margin-right:auto}h1{font-size:19px;margin:0}#section-name{font-size:13px}nav{display:flex;gap:5px}#stage{position:relative;height:calc(100svh - var(--bar-height,110px));min-height:220px;background:#405363;overflow:hidden}canvas{display:block;touch-action:none}#status{position:absolute;left:12px;bottom:12px;background:#f3f0e9eb;padding:7px 10px;font-size:12px;pointer-events:none;border-radius:3px}.input-stick{position:absolute;width:112px;height:112px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #565c6070;background:#ffffff35;pointer-events:none}.input-stick span{position:absolute;width:48px;height:48px;left:50%;top:50%;border-radius:50%;background:#51575b80;transform:translate(-50%,-50%)}#test-videos{background:#f3f0e9;padding:28px max(18px,calc((100% - 1100px)/2));min-height:100svh}h2{font-size:22px;margin:0 0 12px}.help{font-size:13px;line-height:1.7;margin:0 0 24px}#video-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}article{background:white;border:1px solid #d0d0ca;padding:12px}video{display:block;width:100%;aspect-ratio:4/3;background:#405363}h3{font-size:16px;margin:14px 0 8px}article p{font-size:13px;line-height:1.6}.passed{display:inline-block;background:#e3e9df;color:#344531;padding:5px 9px;font-size:12px}@media(max-width:760px){#topbar{gap:8px}.identity{flex:1}#section-name{font-size:12px}nav{order:3;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}nav button{padding:7px 2px;font-size:12px}h1{font-size:17px}#reset{padding:7px 12px}#status{font-size:11px}}@media(max-height:450px) and (min-width:761px){#topbar{gap:8px;padding-top:5px;padding-bottom:5px}button{padding:6px 9px}.identity{gap:8px}h1{font-size:16px}#section-name{font-size:11px}}
</style></head><body>
<header id="topbar"><div class="identity"><h1 id="lab-title">Motion Lab</h1><span id="section-name">Ground movement</span></div><nav aria-label="Camera views"><button data-view="back" aria-pressed="true">Behind</button><button data-view="front" aria-pressed="false">Front</button><button data-view="side" aria-pressed="false">Side</button><button data-view="top" aria-pressed="false">Top</button><button data-view="angled" aria-pressed="false">Angled</button></nav><button id="reset">Reset</button></header>
<main><section id="stage" aria-label="Interactive motion test"><output id="status" aria-label="Movement state">Ready</output></section><section id="test-videos"><h2>Test videos</h2><p class="help">E S D F or arrows: move · J L I K: look · Drag: look · Wheel or pinch: zoom.<br>Phone: left stick moves, right side looks. Gamepad: left stick moves, right stick looks.</p><div id="video-cards"></div></section></main>
<script>/*MOTION_LAB_BUNDLE*/</script></body></html>
