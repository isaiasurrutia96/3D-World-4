<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Assembled avatar</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f1ee;color:#343b40;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:24px;pointer-events:none}h1{font-size:20px;font-weight:550;margin:0 0 6px}p{font-size:13px;margin:0;color:#646b70}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:#ffffffdf;border-radius:14px;box-shadow:0 3px 20px #0001}button{font:inherit;font-size:13px;border:0;border-radius:9px;background:#e8e8e4;color:#343b40;min-height:44px;padding:0 14px;cursor:pointer}button:hover{background:#d8d8d2}button:focus-visible{outline:2px solid #c36a28}#error{position:fixed;top:50%;width:100%;text-align:center}@media(max-width:480px){header{left:18px;top:18px}h1{font-size:18px}nav{bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);width:260px}button{padding:0 12px}}#hand-toggle{position:fixed;top:max(18px,env(safe-area-inset-top));right:18px;background:#fff;box-shadow:0 2px 12px #0001}header{max-width:calc(100% - 132px)}@media(max-width:480px){h1{font-size:16px}header p{font-size:12px;line-height:1.5}}
