    </svg>

  </div>

<style>
  #f1-2026-size-comparison {
    --audi: var(--viz-series-1, var(--blue));
    --kart: var(--viz-series-2, var(--orange));
    --fine-grid: color-mix(in srgb, var(--foreground) 10%, transparent);
    --major-grid: color-mix(in srgb, var(--foreground) 23%, transparent);
    --tire: color-mix(in srgb, var(--foreground) 24%, transparent);
    --measurement: color-mix(in srgb, var(--foreground) 60%, transparent);
    display: grid;
    gap: calc(var(--font-size-base) * .7);
  }
  #f1-2026-size-comparison .f1-figure { min-width: 0; }
  #f1-2026-size-comparison .f1-labels { display: grid; grid-template-columns: 1fr 1fr; }
  #f1-2026-size-comparison .f1-vehicle {
    text-align: center;
    margin-bottom: calc(var(--font-size-base) * .6);
  }
  #f1-2026-size-comparison .f1-vehicle h3 { font-weight: 500; }
  #f1-2026-size-comparison .f1-vehicle h3::before {
    content: "";
    display: inline-block;
    width: .7em;
    height: .13em;
    margin-right: .35em;
    vertical-align: .23em;
    background: var(--vehicle);
  }
  #f1-2026-size-comparison .f1-audi { --vehicle: var(--audi); }
  #f1-2026-size-comparison .f1-kart { --vehicle: var(--kart); }
  #f1-2026-size-comparison .f1-plan { display: block; width: 100%; }
  #f1-2026-size-comparison .f1-plan path,
  #f1-2026-size-comparison .f1-plan circle { vector-effect: non-scaling-stroke; }
  #f1-2026-size-comparison .f1-plan text { fill: var(--foreground); font: inherit; }
  #f1-2026-size-comparison .f1-legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0 calc(var(--font-size-base) * .85);
    margin-top: calc(var(--font-size-base) * .5);
  }
</style>

<script>

  const root = document.getElementById('f1-2026-size-comparison');
  const kart = JSON.parse(document.getElementById('f1-driving-test-plan').textContent);
  const svg = root.querySelector('.f1-plan');
  const figure = root.querySelector('.f1-figure');
  const plan = root.querySelector('[data-plan-content]');

  // Plan coordinates are millimetres relative to the shared rear axle.
  // The R26 uses its published footprint and maximum wheelbase.
  // Its body contours and front/rear overhang split are schematic.

    width: 1900,

      'M-950-315Q-950-355-910-355H-615Q-575-355-575-315V315Q-575 355-615 355H-910Q-950 355-950 315Z',
      'M575-315Q575-355 615-355H910Q950-355 950-315V315Q950 355 910 355H615Q575 355 575 315Z',
    ],
    body: {
      floor: 'M-330-2570L-450-2440-744-1790-751-900-483-420-410-235-422 388-355 551H355L422 388 410-235 483-420 751-900 744-1790 450-2440 330-2570Z',
      wingFront: 'M-875-4370Q-560-4520 0-4540Q560-4520 875-4370L895-3990 767-3960 490-4090 0-4170-490-4090-767-3960-895-3990Z',
      wingFrontFlap: 'M-863-4250Q-520-4390-74-4404M74-4404Q520-4390 863-4250M-818-4115Q-515-4260-78-4282M78-4282Q515-4260 818-4115',
      nose: 'M-57-4510Q-21-4540 0-4540T57-4510L86-4140 110-3725 164-3220Q190-2950 295-2560L344-2120 310-1740 242-1160 155-610 106-265 90 490H-90L-106-265-155-610-242-1160-310-1740-344-2120-295-2560Q-190-2950-164-3220L-110-3725-86-4140Z',

      rightPod: 'M321-2340Q548-2390 644-2185Q727-2040 724-1735Q690-1300 488-1000L243-658Q404-996 430-1480L410-1840Z',
      cockpit: 'M-163-2430Q0-2505 163-2430L217-2080Q208-1835 119-1745H-119Q-208-1835-217-2080Z',
      halo: 'M-191-1970Q-258-2380 0-2460Q258-2380 191-1970M0-2460V-2555',
      spine: 'M-101-1750Q-119-1580-87-1470L-42-703 0-245 42-703 87-1470Q119-1580 101-1750Z',
      wingRear: 'M-532 457L-492 402H492L532 457V900H-532ZM-532 569H532M-532 733H532',
    },
    mechanical: {
      suspension: 'M-174-3140L-670-3400-133-3655M174-3140L670-3400 133-3655M-153-455L-575 0-136 205M153-455L575 0 136 205',
    },
  };

  const ns = 'http://www.w3.org/2000/svg';
  function element(parent, tag, attrs, value) {
    const node = document.createElementNS(ns, tag);
    for (const [name, attr] of Object.entries(attrs)) node.setAttribute(name, attr);
    if (value !== undefined) node.textContent = value;
    parent.append(node);
    return node;
  }

  function path(parent, d, stroke, width, extras = {}) {
    return element(parent, 'path', { d, fill: 'none', stroke, 'stroke-width': width, ...extras });
  }

  function measureLabel(group, x, y, value) {
    const label = element(group, 'text', {
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'text-small tabular-nums',
    }, value);
    const box = label.getBBox();
    const backing = element(group, 'rect', {
      x: box.x - 4, y: box.y - 2, width: box.width + 8, height: box.height + 4,
      rx: 3, fill: 'var(--background)', opacity: .95,
    });
    group.insertBefore(backing, label);
  }

  const metres = millimetres => (Math.round(millimetres / 10) / 100).toFixed(2) + ' m';

  function drawVehicle(parent, car, x, y, scale, accent, lengthSide, limit = false) {
    const group = element(parent, 'g', { transform: `translate(${x} ${y}) scale(${scale})` });
    const bodyFill = `color-mix(in srgb, ${accent} 5%, transparent)`;
    for (const [name, outline] of Object.entries(car.body)) {
      const isDetail = ['floor', 'wingFrontFlap', 'halo', 'lights', 'mirrors', 'exhaust', 'mudFlaps'].includes(name);
      path(group, outline, accent, isDetail ? .75 : 1.05, {
        opacity: isDetail ? .60 : .90, fill: isDetail ? 'none' : bodyFill,
        'fill-rule': 'evenodd', 'stroke-linejoin': 'round',
      });
    }
    for (const outline of Object.values(car.mechanical)) {
      path(group, outline, 'var(--measurement)', .9);
    }
    for (const outline of car.tires) {
      path(group, outline, 'var(--measurement)', 1.05, { fill: 'var(--tire)' });
    }
    const halfWidth = car.width / 2;
    for (const axle of [-car.wheelbase, 0]) {
      path(group, `M${-halfWidth - 60} ${axle}h${car.width + 120}`, accent, 1, { 'stroke-dasharray': '4 3' });
    }
    for (const [cx, cy] of car.tyreCentres) {
      element(group, 'circle', { cx, cy, r: 3.1 / scale, fill: 'var(--background)', stroke: accent, 'stroke-width': 1.5 });
    }

    const edge = lengthSide * (halfWidth + 137);
    const reach = -lengthSide * 115;
    path(group, `M${edge + reach} ${-car.nose}H${edge}V${car.tail}h${reach}`, 'var(--measurement)', .85);
    const widthY = 1070;
    path(group, `M${-halfWidth} ${widthY - 48}v96m0-48H${halfWidth}m0-48v96`, 'var(--measurement)', .85);

    // The wheelbase arrows terminate on the exact axle centerlines.
    const head = 5.5 / scale;
    const flight = 3.2 / scale;
    const front = -car.wheelbase;
    path(group,
      `M0 ${front}V0 M${-flight} ${front + head}L0 ${front} ${flight} ${front + head} M${-flight} ${-head}L0 0 ${flight} ${-head}`,
      accent, 1.45, { 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    measureLabel(parent, x, y - car.wheelbase * scale / 2, (limit ? '≤ ' : '') + metres(car.wheelbase));
  }

  function render() {
    const width = figure.clientWidth;
    if (width === 0) return;
    const scale = Math.min(.086, (width - 10) / 5500);
    const center = width / 2;
    const plotLeft = center - 2750 * scale;
    const plotRight = center + 2750 * scale;
    const rearY = 4750 * scale + 6;
    const plotTop = 6;
    const plotBottom = rearY + 1250 * scale;
    const height = plotBottom + 3;

    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    // Align the headings with the two vehicle centerlines as the plot narrows.
    root.querySelector('.f1-labels').style.marginInline = `${plotLeft}px`;

    plan.replaceChildren();
    const grid = { minor: [], major: [] };
    for (let mm = -2750; mm <= 2750; mm += 250) {
      const x = center + mm * scale;
      grid[mm % 1000 ? 'minor' : 'major'].push(`M${x} ${plotTop}V${plotBottom}`);
    }
    for (let mm = -4750; mm <= 1250; mm += 250) {
      const y = rearY + mm * scale;
      if (mm !== 0) grid[mm % 1000 ? 'minor' : 'major'].push(`M${plotLeft} ${y}H${plotRight}`);
    }
    path(plan, grid.minor.join(''), 'var(--fine-grid)', .65);
    path(plan, grid.major.join(''), 'var(--major-grid)', .85);
    path(plan, `M${plotLeft} ${rearY}H${plotRight}`, 'var(--measurement)', 1.05, { 'stroke-dasharray': '3 4' });
    drawVehicle(plan, audi, center - 1375 * scale, rearY, scale, 'var(--audi)', -1, true);
    drawVehicle(plan, kart, center + 1375 * scale, rearY, scale, 'var(--kart)', 1);
  }

  new ResizeObserver(render).observe(figure);
  render();
})();
</script>
