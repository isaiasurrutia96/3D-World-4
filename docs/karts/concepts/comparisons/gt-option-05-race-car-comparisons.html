<style>
#gt-option-05-comparisons > .viz-controls { justify-content: start; }
#gt-option-05-comparisons > [data-comparison] { width: min(100%, 620px); margin: 0 auto; }

#gt-option-05-comparisons .gt-plan {
  display: block;
  width: 100%;
  height: auto;
  color: var(--foreground);
  font-family: system-ui, sans-serif;
  --minor: color-mix(in srgb, var(--foreground) 12%, transparent);
  --major: color-mix(in srgb, var(--foreground) 24%, transparent);
  --ink: color-mix(in srgb, var(--foreground) 67%, transparent);
  --tire-fill: color-mix(in srgb, var(--foreground) 18%, transparent);
}
#gt-option-05-comparisons .gt-plan path, #gt-option-05-comparisons .gt-plan .tire, #gt-option-05-comparisons .gt-plan .hub { vector-effect: non-scaling-stroke; }
#gt-option-05-comparisons .gt-plan path { fill: none; stroke-linejoin: round; }
#gt-option-05-comparisons .gt-plan text { fill: currentColor; text-anchor: middle; }
#gt-option-05-comparisons .gt-plan .vehicle-name { font-size: 19px; font-weight: 500; }
#gt-option-05-comparisons .gt-plan .footprint, #gt-option-05-comparisons .gt-plan .legend { font-size: 18px; }
#gt-option-05-comparisons .gt-plan .wheelbase { font-size: 20px; font-weight: 500; }
#gt-option-05-comparisons .gt-plan .legend { fill: var(--muted-foreground); }
#gt-option-05-comparisons .gt-plan .race { --car-ink: var(--viz-series-1, var(--blue)); }
#gt-option-05-comparisons .gt-plan .kart { --car-ink: var(--viz-series-2, var(--orange)); }
#gt-option-05-comparisons .gt-plan .grid-minor { stroke: var(--minor); stroke-width: .7px; }
#gt-option-05-comparisons .gt-plan .grid-major { stroke: var(--major); stroke-width: .8px; }
#gt-option-05-comparisons .gt-plan .shared-rear { stroke: var(--ink); stroke-width: 1px; stroke-dasharray: 3px 4px; }
#gt-option-05-comparisons .gt-plan .swatch { display: none; }
#gt-option-05-comparisons .gt-plan .shell-fill { fill: var(--car-ink); opacity: .055; }
#gt-option-05-comparisons .gt-plan .shell-edge, #gt-option-05-comparisons .gt-plan .kart-shell, #gt-option-05-comparisons .gt-plan .wing, #gt-option-05-comparisons .gt-plan .kart-wing, #gt-option-05-comparisons .gt-plan .feature { stroke: var(--car-ink); stroke-width: 1.25px; }
#gt-option-05-comparisons .gt-plan .kart-shell, #gt-option-05-comparisons .gt-plan .kart-wing { fill: color-mix(in srgb, var(--car-ink) 5%, transparent); fill-rule: evenodd; }
#gt-option-05-comparisons .gt-plan .wing { fill: color-mix(in srgb, var(--car-ink) 9%, transparent); }
#gt-option-05-comparisons .gt-plan .feature { fill: color-mix(in srgb, var(--car-ink) 13%, transparent); }
#gt-option-05-comparisons .gt-plan .detail { stroke: var(--car-ink); stroke-width: .85px; opacity: .71; }
#gt-option-05-comparisons .gt-plan .internals, #gt-option-05-comparisons .gt-plan .bracket, #gt-option-05-comparisons .gt-plan .tire { stroke: var(--ink); stroke-width: .95px; }
#gt-option-05-comparisons .gt-plan .tire { fill: var(--tire-fill); fill-rule: evenodd; }
#gt-option-05-comparisons .gt-plan .label-back, #gt-option-05-comparisons .gt-plan .hub { fill: var(--background); }
#gt-option-05-comparisons .gt-plan .axle, #gt-option-05-comparisons .gt-plan .arrow, #gt-option-05-comparisons .gt-plan .hub { stroke: var(--car-ink); stroke-width: 1.45px; }
#gt-option-05-comparisons .gt-plan .axle { stroke-width: .95px; stroke-dasharray: 4px 3px; }

</style>
<script>
(() => {
  const root = document.getElementById('gt-option-05-comparisons');
  const picker = root.querySelector('select');
  const comparisons = new Map([...root.querySelectorAll('[data-comparison]')].map(panel => [panel.dataset.comparison, panel]));
  function showComparison() {
    for (const [name, panel] of comparisons) panel.hidden = name !== picker.value;
  }
  function restore(state) {
    const car = state?.modelContent?.car;
    if (comparisons.has(car)) picker.value = car;
    showComparison();
  }
  picker.addEventListener('change', () => {
    showComparison();
    window.openai?.setWidgetState?.({ modelContent: { car: picker.value }, privateContent: null })?.catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  restore(window.openai?.widgetState);
})();
</script>
