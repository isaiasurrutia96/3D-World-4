<style>
#s-option-01-comparisons > .viz-controls { justify-content: start; }
#s-option-01-comparisons > [data-comparison] { width: min(100%, 620px); margin: 0 auto; }

#s-option-01-comparisons .gt-plan {
  display: block;
  width: 100%;
  height: auto;
  color: var(--foreground);
  font-family: system-ui, sans-serif;
  --minor: color-mix(in srgb, var(--foreground) 12%, transparent);
  --major: color-mix(in srgb, var(--foreground) 24%, transparent);
  --ink: color-mix(in srgb, var(--foreground) 67%, transparent);
  --tire-fill: color-mix(in srgb, var(--foreground) 18%, transparent);
}
#s-option-01-comparisons .gt-plan path, #s-option-01-comparisons .gt-plan .tire, #s-option-01-comparisons .gt-plan .hub { vector-effect: non-scaling-stroke; }
#s-option-01-comparisons .gt-plan path { fill: none; stroke-linejoin: round; }
#s-option-01-comparisons .gt-plan text { fill: currentColor; text-anchor: middle; }
#s-option-01-comparisons .gt-plan .vehicle-name { font-size: 19px; font-weight: 500; }
#s-option-01-comparisons .gt-plan .footprint, #s-option-01-comparisons .gt-plan .legend { font-size: 18px; }
#s-option-01-comparisons .gt-plan .wheelbase { font-size: 20px; font-weight: 500; }
#s-option-01-comparisons .gt-plan .legend { fill: var(--muted-foreground); }
#s-option-01-comparisons .gt-plan .race { --car-ink: var(--viz-series-1, var(--blue)); }
#s-option-01-comparisons .gt-plan .kart { --car-ink: var(--viz-series-2, var(--orange)); }
#s-option-01-comparisons .gt-plan .grid-minor { stroke: var(--minor); stroke-width: .7px; }
#s-option-01-comparisons .gt-plan .grid-major { stroke: var(--major); stroke-width: .8px; }
#s-option-01-comparisons .gt-plan .shared-rear { stroke: var(--ink); stroke-width: 1px; stroke-dasharray: 3px 4px; }
#s-option-01-comparisons .gt-plan .swatch { display: none; }
#s-option-01-comparisons .gt-plan .shell-fill { fill: var(--car-ink); opacity: .055; }
#s-option-01-comparisons .gt-plan .shell-edge, #s-option-01-comparisons .gt-plan .kart-shell, #s-option-01-comparisons .gt-plan .wing, #s-option-01-comparisons .gt-plan .kart-wing, #s-option-01-comparisons .gt-plan .feature { stroke: var(--car-ink); stroke-width: 1.25px; }
#s-option-01-comparisons .gt-plan .kart-shell, #s-option-01-comparisons .gt-plan .kart-wing { fill: color-mix(in srgb, var(--car-ink) 5%, transparent); fill-rule: evenodd; }
#s-option-01-comparisons .gt-plan .wing { fill: color-mix(in srgb, var(--car-ink) 9%, transparent); }
#s-option-01-comparisons .gt-plan .feature { fill: color-mix(in srgb, var(--car-ink) 13%, transparent); }
#s-option-01-comparisons .gt-plan .detail { stroke: var(--car-ink); stroke-width: .85px; opacity: .71; }
#s-option-01-comparisons .gt-plan .internals, #s-option-01-comparisons .gt-plan .bracket, #s-option-01-comparisons .gt-plan .tire { stroke: var(--ink); stroke-width: .95px; }
#s-option-01-comparisons .gt-plan .tire { fill: var(--tire-fill); fill-rule: evenodd; }
#s-option-01-comparisons .gt-plan .label-back, #s-option-01-comparisons .gt-plan .hub { fill: var(--background); }
#s-option-01-comparisons .gt-plan .axle, #s-option-01-comparisons .gt-plan .arrow, #s-option-01-comparisons .gt-plan .hub { stroke: var(--car-ink); stroke-width: 1.45px; }
#s-option-01-comparisons .gt-plan .axle { stroke-width: .95px; stroke-dasharray: 4px 3px; }

</style>
<script>
(() => {
  const root = document.getElementById('s-option-01-comparisons');
  const picker = root.querySelector('select');
  const comparisons = new Map([...root.querySelectorAll('[data-comparison]')].map(panel => [panel.dataset.comparison, panel]));
  function showComparison() {
    for (const [name, panel] of comparisons) panel.hidden = name !== picker.value;
  }
  function restore(state) {
    const car = state?.modelContent?.car;
    if (comparisons.has(car)) picker.value = car;
    showComparison();
  }
  picker.addEventListener('change', () => {
    showComparison();
    window.openai?.setWidgetState?.({ modelContent: { car: picker.value }, privateContent: null })?.catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  restore(window.openai?.widgetState);
})();
</script>
