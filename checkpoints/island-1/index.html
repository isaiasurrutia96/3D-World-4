<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f1f1ee">
 <title>Island Lab</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f1ee;color:#343b40}
  button{font:inherit;cursor:pointer;touch-action:manipulation}
  .app{height:100dvh;display:grid;grid-template-rows:76px minmax(0,1fr)}
  header{display:flex;align-items:center;padding:16px 28px;border-bottom:1px solid #dddcd5}
  h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.6px;font-weight:650}
  .sub{margin:5px 0 0;font-size:12px;color:#747870}
  #stage{position:relative;min-height:0;overflow:hidden;background:#405363}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .stage-hint{position:absolute;top:18px;left:26px;color:#d1dbe3;font-size:12px;pointer-events:none}
  .views{position:absolute;left:50%;bottom:max(23px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:5px;border-radius:14px;background:#ffffffdc;box-shadow:0 3px 16px #00000008}

  .views button[aria-pressed=true]{background:#dfdfd7;color:#303835}
  .views button{white-space:nowrap}@media(max-width:700px){.views button{padding:0 10px}.app{grid-template-rows:65px minmax(0,1fr)}header{padding:12px 18px}h1{font-size:20px}.sub{font-size:11px}.stage-hint{top:13px;left:18px;font-size:11px}}
 </style>
</head>
